services:
  - type: web
    name: whisper-api
    runtime: go
    plan: free
    rootDir: backend
    buildCommand: go build -tags netgo -ldflags '-s -w' -o whisper-api ./cmd/api
    startCommand: ./whisper-api
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: GIN_MODE
        value: release
